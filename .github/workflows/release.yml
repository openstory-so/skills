name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and release the version in plugin.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version plugin.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do"; exit 0
          fi
          jq -er '.extensions["com.openai"].publication.release_notes | select(. != "")' plugin.json > "$RUNNER_TEMP/notes.md" \
            || { echo "::error::publication.release_notes is missing from plugin.json (see AGENTS.md)."; exit 1; }
          # The ChatGPT directory takes this zip as a manual upload at platform.openai.com/plugins.
          zip -qr "$RUNNER_TEMP/openstory-$tag.zip" . -x '.git/*' '.github/*' '.agents/*'
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/openstory-$tag.zip"
          echo "Released $tag"
