name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release the version in plugin.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version plugin.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do"; exit 0
          fi
          jq -r '.extensions["com.openai"].publication.release_notes' plugin.json > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released $tag"
